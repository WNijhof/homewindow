# Builds the installer, with .NET included, and publishes it as a GitHub release.
# Start it by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
# HomeWindow checks the latest release at start-up and updates itself from it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.2.0 (builds the installer as an artifact, no release)'
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A release with failing tests does not go out
      - name: Test
        run: dotnet test HomeWindow.slnx --nologo

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          "value=$v" >> $env:GITHUB_OUTPUT

      # Code signing by SignPath (docs/SIGNING.md). It switches on once the repository variable
      # SIGNPATH_ORGANIZATION_ID is set; until then the installer goes out unsigned, as before.
      # Tag builds use the release certificate, which needs an approval in SignPath for each
      # release; a manual run uses the test certificate.
      # The Homey API client for signing in with a Homey account (Core/AthomLogin.cs); without these secrets
      # that sign-in is hidden and only the API key remains
      - name: Publish app
        shell: pwsh
        env:
          HOMEY_CLIENT_ID: ${{ secrets.HOMEY_CLIENT_ID }}
          HOMEY_CLIENT_SECRET: ${{ secrets.HOMEY_CLIENT_SECRET }}
        run: ./scripts/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -SelfContained -PublishOnly

      - name: Upload app for signing
        id: upload-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: HomeWindow-app-unsigned-${{ steps.version.outputs.value }}
          path: publish/

      - name: Sign app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: homewindow
          signing-policy-slug: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: publish-signed

      # The installer is built from the signed app
      - name: Use signed app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Remove-Item publish -Recurse -Force
          Move-Item publish-signed publish

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -SelfContained -InstallerOnly -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Upload installer for signing
        id: upload-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: HomeWindow-Setup-unsigned-${{ steps.version.outputs.value }}
          path: installer/Output/HomeWindow-Setup-${{ steps.version.outputs.value }}.exe

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: homewindow
          signing-policy-slug: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer/Signed

      - name: Use signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Move-Item "installer/Signed/HomeWindow-Setup-${{ steps.version.outputs.value }}.exe" installer/Output -Force

      - uses: actions/upload-artifact@v7
        with:
          name: HomeWindow-Setup-${{ steps.version.outputs.value }}
          path: installer/Output/HomeWindow-Setup-*.exe

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          # A list, also with one file: @files splats a plain string letter by letter
          $files = @("installer/Output/HomeWindow-Setup-$v.exe")
          # Written release notes when there are any (docs/releases/<version>.md, its first line the title)
          $notes = "docs/releases/$v.md"
          if (Test-Path $notes) {
            $lines = Get-Content $notes -Encoding utf8
            $title = $lines[0] -replace '^#\s*', ''
            # The title line goes into the title only, not a second time at the top of the notes
            $body = "installer/Output/notes.md"
            ($lines | Select-Object -Skip 1) -join "`n" | ForEach-Object { $_.Trim() } | Set-Content $body -Encoding utf8
            gh release create "v$v" @files --title $title --notes-file $body
          } else {
            gh release create "v$v" @files --title "HomeWindow $v" --generate-notes
          }
